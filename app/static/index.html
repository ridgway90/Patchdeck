<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patchdeck</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23e5702a'/><path d='M9 17l5 5 9-11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1>Patchdeck</h1>
        <p id="summary" class="muted">Loading…</p>
      </div>
    </div>
    <nav class="tabs" aria-label="Views">
      <a href="#" data-view="dash" class="tab active">Dashboard</a>
      <a href="#settings" data-view="settings" class="tab">Settings</a>
    </nav>
    <div class="actions" id="dash-actions">
      <button id="check-all" class="btn">Check now</button>
      <button id="update-all" class="btn primary">Update all…</button>
    </div>
  </header>

  <main id="view-dash">
    <div id="hosts"></div>

    <section class="panel activity">
      <h2>Recent activity</h2>
      <ul id="jobs" class="jobs"></ul>
    </section>
  </main>

  <main id="view-settings" hidden></main>

  <aside id="log" class="log" hidden>
    <div class="log-head">
      <div>
        <strong id="log-title"></strong>
        <span id="log-status" class="pill"></span>
      </div>
      <button id="log-close" class="btn ghost" aria-label="Close log">✕</button>
    </div>
    <pre id="log-body"></pre>
  </aside>

  <dialog id="upd" class="modal" aria-labelledby="upd-title">
    <form id="upd-form" method="dialog">
      <h2 id="upd-title"></h2>
      <p id="upd-sub" class="muted"></p>
      <div class="choices" role="radiogroup" aria-label="When">
        <label class="choice"><input type="radio" name="when" value="now">
          <span><strong>Update now</strong><small id="upd-now-hint"></small></span></label>
        <label class="choice"><input type="radio" name="when" value="schedule">
          <span><strong>Schedule for a maintenance window</strong>
            <select id="upd-window" aria-label="Maintenance window"></select>
            <small id="upd-win-hint"></small></span></label>
      </div>
      <label class="check" id="upd-snap-row"><input type="checkbox" id="upd-snap"> <span id="upd-snap-text">Take a snapshot first</span></label>
      <label class="check" id="upd-reboot-row"><input type="checkbox" id="upd-reboot"> Reboot afterwards if the update requires it</label>
      <label class="check" id="upd-docker-row" hidden><input type="checkbox" id="upd-docker"> <span id="upd-docker-text"></span></label>
      <p id="upd-warn" class="warn-box" hidden></p>
      <label class="check" id="upd-override-row" hidden><input type="checkbox" id="upd-override"> <span id="upd-override-text"></span></label>
      <div class="modal-actions">
        <button type="button" id="upd-unschedule" class="btn ghost danger" hidden>Remove from schedule</button>
        <span class="spacer"></span>
        <button type="button" id="upd-cancel" class="btn">Cancel</button>
        <button type="submit" id="upd-go" class="btn primary">Update now</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js"></script>
  <script src="/static/settings.js"></script>
</body>
</html>
