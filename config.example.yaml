# Copy to data/config.yaml and edit.

# Used for the link in Discord messages (your Tailscale name works well).
base_url: http://patchdeck.your-tailnet.ts.net:8080

auth:
  username: admin
  password: change-me            # or set PATCHDECK_PASSWORD

ssh:
  user: root
  key_file: /data/id_ed25519      # private key authorised on each PVE host
  known_hosts: /data/known_hosts  # fill with: ssh-keyscan <host> >> data/known_hosts

hosts:
  - name: pve1
    address: 192.168.1.10
  - name: pve2
    address: 192.168.1.11
  - name: pbs
    address: 192.168.1.20
    type: pbs                     # pve (default) | pbs | debian

# Optional: where the Console / Shell buttons go. Default is the Proxmox web console.
# Placeholders: {vmid} {node} {name} {address} {host}
# console_url: "https://{address}:8006/?console=lxc&xtermjs=1&vmid={vmid}&node={node}"
# host_console_url: "https://{address}:8006/?console=shell&xtermjs=1&node={node}"
# You can also set console_url per host under hosts:.

schedule:
  check_times: ["08:00"]          # local time (TZ); add more e.g. ["08:00", "18:00"]

# Maintenance windows: times updates may run out of hours. End before start = past midnight.
maintenance:
  windows:
    - name: Weekend nights
      days: [5, 6]                # 0 = Monday … 6 = Sunday
      start: "02:00"
      end: "05:00"
    - name: Weeknights
      days: [0, 1, 2, 3]
      start: "23:30"
      end: "01:30"

# Per-target schedules ("host/vmid" or "host/host"). Easier to set under Settings → Maintenance schedules.
#   window: which window this target's updates go in
#   auto:   check and update it in that window automatically
#   reboot: reboot afterwards if the update needs it
schedules:
  pve1/105: {window: Weekend nights, auto: true, reboot: true}
  pbs/host: {window: Weekend nights, auto: false, reboot: true}
  pve1/201:immich: {window: Weeknights, auto: true}   # a Docker stack: host/vmid:stack

discord:
  webhook: ""                     # or set DISCORD_WEBHOOK
  on_check: always                # always | new (only when new updates appear) | off
  on_update: true                 # message when updates finish

snapshots:
  enabled: true                   # default for the "Snapshot first" toggle
  keep: 3                         # pre-update snapshots kept per container
  on_failure: abort               # abort | continue (e.g. storage without snapshot support)

windows_updates:
  drivers: false                  # include driver updates for Windows VMs

docker:
  enabled: true                   # check Compose stacks for new image versions
  prune: true                     # docker image prune -f after updating a stack
  logins:                         # optional; easier to add under Settings → Docker
    - registry: docker.io
      username: your-docker-id
      token: dckr_pat_xxxxxxxx    # read-only personal access token

# Container IDs to hide entirely
exclude: []
